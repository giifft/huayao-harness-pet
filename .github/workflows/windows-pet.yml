name: Windows desktop smoke test
on:
  push:
    branches: [main]
    paths:
      - 'WindowsPet/**'
      - 'Resources/**'
      - 'Tests/Fixtures/HarnessUsage.json'
      - '.github/workflows/windows-pet.yml'
      - 'LICENSE'
      - 'NOTICE-ARTWORK.zh-CN.txt'
  pull_request:
    paths:
      - 'WindowsPet/**'
      - 'Resources/**'
      - 'Tests/Fixtures/HarnessUsage.json'
      - '.github/workflows/windows-pet.yml'
      - 'LICENSE'
      - 'NOTICE-ARTWORK.zh-CN.txt'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Draft release tag to receive the verified Windows ZIP'
        type: string
        required: false
permissions:
  contents: read

jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Exercise Harness readers and companion hooks
        run: dotnet run --project WindowsPet/ReaderSmoke -c Release
      - name: Build self-contained Windows app
        run: dotnet publish WindowsPet/Desktop -c Release -r win-x64 --self-contained true -o pet-win-x64
      - name: Start the desktop pet on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = (Resolve-Path "pet-win-x64").Path
          $notices = @('LICENSE-CODE.txt', 'NOTICE-ARTWORK.zh-CN.txt', 'ZstdSharp-LICENSE.txt', 'DotNet-LICENSE.txt', 'DotNet-THIRD-PARTY-NOTICES.txt', 'DotNet-WindowsDesktop-LICENSE.txt')
          $sounds = @('tap', 'land', 'cost', 'question', 'approval') | ForEach-Object { "PetSounds/$_.wav" }
          foreach ($file in ($notices + $sounds)) {
            if (-not (Test-Path (Join-Path $out $file) -PathType Leaf)) { throw "Missing release file $file." }
          }
          foreach ($group in @(@{ Prefix = 'duo'; Count = 21 }, @{ Prefix = 'hua'; Count = 13 }, @{ Prefix = 'sheng'; Count = 4 })) {
            $portraits = Get-ChildItem "$out/Pets" -File -Filter "$($group.Prefix)_*.png"
            if ($portraits.Count -ne $group.Count) { throw "Expected $($group.Count) $($group.Prefix) portraits." }
          }
          $env:DSH_HOME = Join-Path $env:RUNNER_TEMP "empty-harness-home"
          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          using System.Text;
          public static class PetWindows
          {
              private delegate bool Visit(IntPtr hwnd, IntPtr unused);
              [DllImport("user32.dll")]
              private static extern bool EnumWindows(Visit callback, IntPtr data);
              [DllImport("user32.dll")]
              private static extern bool IsWindowVisible(IntPtr hwnd);
              [DllImport("user32.dll")]
              private static extern uint GetWindowThreadProcessId(IntPtr hwnd, out uint processId);
              [DllImport("user32.dll", CharSet = CharSet.Unicode)]
              private static extern int GetWindowText(IntPtr hwnd, StringBuilder text, int limit);
              public static bool HasVisiblePetWindow(uint expectedPid, string title)
              {
                  bool found = false;
                  EnumWindows((hwnd, unused) => {
                      uint pid;
                      GetWindowThreadProcessId(hwnd, out pid);
                      if (pid != expectedPid || !IsWindowVisible(hwnd)) return true;
                      var caption = new StringBuilder(100);
                      GetWindowText(hwnd, caption, caption.Capacity);
                      if (caption.ToString() != title) return true;
                      found = true;
                      return false;
                  }, IntPtr.Zero);
                  return found;
              }
          }
          '@
          # A WPF window with ShowInTaskbar=false has an owner, so MainWindowHandle excludes it.
          $pet = Start-Process (Join-Path $out "HuaYaoPet.exe") -PassThru -WorkingDirectory $env:RUNNER_TEMP
          try {
            $windowReady = $false
            for ($i = 0; $i -lt 32; $i++) {
              Start-Sleep -Milliseconds 300
              $pet.Refresh()
              if ($pet.HasExited) { throw "The app exited during launch (code $($pet.ExitCode))." }
              if ([PetWindows]::HasVisiblePetWindow($pet.Id, '花妖桌宠')) {
                $windowReady = $true
                break
              }
            }
            if (-not $windowReady) { throw "The desktop window did not become visible." }
            Start-Sleep -Milliseconds 1000
            $pet.Refresh()
            if ($pet.HasExited) { throw "The app exited after launch (code $($pet.ExitCode))." }
            Write-Output "WPF window created on Windows x64, process $($pet.Id)."
          }
          finally {
            if (-not $pet.HasExited) { Stop-Process -Id $pet.Id }
          }
      - name: Package the verified release build
        if: inputs.release_tag != ''
        shell: pwsh
        run: |
          Rename-Item pet-win-x64 HuaYaoPet-Windows-x64
          Compress-Archive -Path HuaYaoPet-Windows-x64 -DestinationPath huayao-desktop-windows-x64.zip
      - uses: actions/upload-artifact@v4
        if: inputs.release_tag != ''
        with:
          name: windows-release
          path: huayao-desktop-windows-x64.zip
          if-no-files-found: error
          compression-level: 0

  upload:
    if: inputs.release_tag != '' && github.ref == 'refs/heads/main'
    needs: smoke
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
      - name: Upload to the matching draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          target=$(gh release view "$RELEASE_TAG" --json isDraft,targetCommitish --jq 'select(.isDraft) | .targetCommitish')
          [[ "$target" == "$GITHUB_SHA" ]]
          gh release upload "$RELEASE_TAG" huayao-desktop-windows-x64.zip
